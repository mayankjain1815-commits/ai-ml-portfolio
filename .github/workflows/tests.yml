name: tests

# Every project is self-contained and its suite runs fully offline, so the
# portfolio can be verified in CI with no API keys and no network calls.
# The seven Python projects plus the backend share Python 3.13; SENTINEL (08) is a Node app.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-orbit-voice-assistant
          - 02-crew-engine
          - 03-rag-studio
          - 04-model-watch
          - 05-skill-forge
          - 06-gh-activity-forge
          - 07-disaster-watch
          - backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r "${{ matrix.project }}/requirements.txt"
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: python -m pytest -q

  sentinel:
    name: 08-sentinel-iot (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-sentinel-iot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 08-sentinel-iot/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build

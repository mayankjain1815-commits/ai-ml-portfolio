{% extends "base.html" %}
{% block title %}Sanket · Login{% endblock %}
{% block breadcrumbs %}System / Login{% endblock %}
{% block content %}
<div class="panel" style="max-width:480px;margin:40px auto;">
  <div class="panel-header"><div class="panel-title">Secure Access</div></div>
  <div class="panel-body">
    <div class="form-row"><label>Email / Username</label><input class="input" placeholder="user@ndma.gov.in"></div>
    <div class="form-row"><label>Password</label><input class="input" type="password" placeholder="••••••••"></div>
    <button class="btn" style="margin-top:12px;">Sign In</button>
    <div class="note">Demo mode — no authentication enforced</div>
  </div>
</div>
{% endblock %}
